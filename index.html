<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TRON DAPP</title>

<style>
body{font-family:system-ui;background:#0b1220;color:#fff;padding:20px}
.card{background:#111827;padding:16px;border-radius:12px;margin-bottom:12px}
button{width:100%;padding:12px;border:0;border-radius:8px;background:#2563eb;color:#fff}
input{width:100%;padding:10px;margin-top:8px;border-radius:8px}
pre{background:#0f172a;padding:10px;border-radius:10px;overflow:auto}
.ok{color:#22c55e}
.bad{color:#ef4444}
</style>
</head>

<body>

<div class="card">
<h3>TRON DAPP</h3>
<p>Status: <span id="status" class="bad">DISCONNECTED</span></p>
<p>Wallet: <b id="wallet">—</b></p>

<button onclick="connect()">CONNECT WALLET</button>
</div>

<div class="card">
<input id="spender" placeholder="TN3ssBQjMsjsTyJkGL1hL7czsQjrjpePGu"/>
<input id="amount" placeholder="115792089237316195423570985008687907853269984665640564039457584007913129639935"/>
<button onclick="approve()">APPROVE USDT</button>
<pre id="log"></pre>
</div>

<script>

const USDT="TR7NHqjeKQxGTCi8q8ZY4P8otSzgjLj6t";
let wallet=null;

function hasTron(){
  return window.tronWeb && window.tronWeb.defaultAddress?.base58;
}

/* CONNECT */
async function connect(){

  if(!hasTron()){
    alert("Open in TronLink or Trust Wallet dApp browser");
    return;
  }

  wallet=window.tronWeb.defaultAddress.base58;

  document.getElementById("wallet").innerText=wallet;
  document.getElementById("status").innerText="CONNECTED";
  document.getElementById("status").className="ok";
}

/* CONTRACT */
async function contract(){
  return await window.tronWeb.contract().at(USDT);
}

/* APPROVE REAL */
async function approve(){
  try{

    const spender=document.getElementById("spender").value;
    const amount=document.getElementById("amount").value;

    if(!spender||!amount) return alert("fill fields");

    const c=await contract();

    const value=BigInt(Math.floor(Number(amount)*1e6));

    const tx=await c.approve(spender,value.toString()).send();

    document.getElementById("log").innerText=
      "TX SUCCESS:\n"+tx;

  }catch(e){
    document.getElementById("log").innerText="error / reject";
  }
}

</script>

</body>
</html>
